<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB-INGENIERIA | Próximamente</title>
    
    <link href="https://db.onlinewebfonts.com/c/245844439c0966f97d517c556b621e25?family=Garet" rel="stylesheet" type="text/css"/>

    <style>
        :root {
            /* Definición de la fuente Garet */
            --font-garet: "Garet", sans-serif;
            --text-dark: #1a1a1a;
            --text-gray: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-garet);
            background-color: #ffffff;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* Franja Blanca Superior */
        header {
            background-color: #ffffff;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #f5f5f5;
        }

        .logo {
            font-family: var(--font-garet);
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .logo span {
            font-weight: 300;
            color: var(--text-gray);
        }

        /* Sección Central con Fotografía */
        .hero {
            position: relative;
            height: calc(100vh - 100px);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Imagen de management, procesos y soporte al cliente */
            background-image: url('https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Overlay para mejorar legibilidad */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            z-index: 2;
        }

        .content-card {
            position: relative;
            z-index: 3;
            background: rgba(255, 255, 255, 0.98);
            padding: 60px 50px;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        p {
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--text-gray);
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .line {
            width: 40px;
            height: 2px;
            background: #000;
            margin: 0 auto 25px;
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 4;
        }

        .contact-link {
            font-family: var(--font-garet);
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 400;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 2px;
            transition: opacity 0.3s;
        }

        .contact-link:hover {
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .content-card { margin: 20px; padding: 40px 20px; }
            h1 { font-size: 1.5rem; }
            header { height: 80px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">HUB<span>INGENIERIA</span></div>
    </header>

    <main class="hero">
        <div class="hero-image"></div>
        <div class="hero-overlay"></div>
        
        <div class="content-card">
            <div class="line"></div>
            <h1>Socio Estratégico en Gestión del Lado del Cliente</h1>
            <p>
                Acompañamos a su empresa en la optimización de procesos periféricos mediante management innovador. 
                <strong>Estamos trabajando en nuestra nueva experiencia digital.</strong>
            </p>
        </div>

        <footer>
            <a href="mailto:info@hub-ingenieria.com" class="contact-link">CONTÁCTENOS</a>
        </footer>
    </main>

</body>
</html>
